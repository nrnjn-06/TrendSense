# Database Configuration (MySQL)
db.url=jdbc:mysql://localhost:3306/social_analytics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.username=root
db.password=
db.driver=com.mysql.cj.jdbc.Driver

# Fallback mode: true allows seamless fallback to embedded database when MySQL is unavailable
db.fallback.enabled=true
db.fallback.url=jdbc:h2:./data/social_analytics;MODE=MySQL;DATABASE_TO_UPPER=false;AUTO_SERVER=TRUE
db.fallback.username=sa
db.fallback.password=

# Platform API Credentials & OAuth Configurations
# Leave credentials empty to run in Demo Mode. Provide in .env for Live Mode.
# Meta / Instagram Graph API
instagram.client.id=
instagram.client.secret=
instagram.redirect.uri=http://localhost:8080/oauth/callback/instagram
instagram.oauth.scopes=instagram_business_basic,instagram_business_manage_comments
instagram.access.token=

# Meta / Facebook Pages API
facebook.app.id=
facebook.app.secret=
facebook.redirect.uri=http://localhost:8080/oauth/callback/facebook
facebook.oauth.scopes=public_profile
facebook.page.access.token=

# LinkedIn Community Management API
linkedin.client.id=
linkedin.client.secret=
linkedin.redirect.uri=http://localhost:8080/oauth/callback/linkedin
linkedin.oauth.scopes=openid profile email w_member_social
linkedin.access.token=

# X / Twitter API v2
x.client.id=
x.client.secret=
x.redirect.uri=http://localhost:8080/oauth/callback/x
x.bearer.token=

# Analytics Configuration
trend.weight.mention=0.25
trend.weight.engagement=0.35
trend.weight.growth=0.25
trend.weight.recency=0.15
